services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      TF_DATA_DIR: /data
      TF_COOKIE_SECURE: "0"
      TF_MOCK_STAGE_SECONDS: "2"
      TF_MAX_UPLOAD_MB: "30"
      TF_UPLOADS_PER_DAY: "3"
    volumes:
      - tabforge-data:/data
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      TF_DATA_DIR: /data
      TF_MOCK_STAGE_SECONDS: "2"
    volumes:
      - tabforge-data:/data
    restart: unless-stopped

volumes:
  tabforge-data:
