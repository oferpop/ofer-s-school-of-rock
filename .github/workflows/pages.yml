name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages serves static files only: the Python accounts API needs a host
      # that runs server.py, so the deployed site works in guest mode.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html css js favicon.svg _site/
          # Pages has no API; tell the client so it skips a doomed probe.
          sed -i 's|<link rel="icon" href="favicon.svg"|<meta name="osr-static" content="true" />\n    <link rel="icon" href="favicon.svg"|' _site/index.html
          grep -q 'osr-static' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
